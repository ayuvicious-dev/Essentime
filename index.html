<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Essentime</title>
<meta name="description" content="Essentime, timer sederhana untuk ritual harianmu.">
<meta name="theme-color" content="#B8763E">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFFBF3;
    --paper:#FFFFFF;
    --gold-light:#E8B876;
    --gold-dark:#B8763E;
    --gold-mid:#D9A05B;
    --brown:#4A2F18;
    --brown-soft:#8A6B49;
    --brown-faint:#C9AE8C;
    --line:#EFE2CD;
    --shadow: rgba(90,58,30,0.10);
    --danger:#B5533C;
    --ok:#6E8B57;
    --glow:#FFF3DE;
    --radius-card: 20px;
    --radius-input: 12px;
    --serif: 'Playfair Display', Georgia, serif;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  html[data-theme="dark"]{
    --cream:#1C1712;
    --paper:#26201A;
    --gold-light:#E8B876;
    --gold-dark:#C98A4F;
    --gold-mid:#D9A05B;
    --brown:#F3E9DA;
    --brown-soft:#C9AE8C;
    --brown-faint:#8A7359;
    --line:#3A3126;
    --shadow: rgba(0,0,0,0.35);
    --danger:#E28A72;
    --ok:#9BC17F;
    --glow:#2E2519;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, var(--glow) 0%, transparent 60%),
      var(--cream);
    color:var(--brown);
    font-family:var(--sans);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;}
  input{font-family:inherit;}

  a{color:var(--gold-dark);}

  .shell{
    max-width:460px;
    margin:0 auto;
    min-height:100vh;
    padding:28px 20px 110px;
    display:flex;
    flex-direction:column;
  }

  /* ---------- brand mark ---------- */
  .brandmark{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .brandmark img{width:38px;height:38px;display:block;}
  .brandmark .wordmark{
    font-family:var(--serif);
    font-weight:700;
    font-size:26px;
    color:var(--brown);
    letter-spacing:0.2px;
  }

  /* ---------- auth screen ---------- */
  #auth-screen{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:20px 0;
  }
  #auth-screen .brandmark{
    flex-direction:column;
    gap:14px;
    margin-bottom:6px;
  }
  #auth-screen .brandmark img{width:72px;height:72px;}
  #auth-screen .wordmark{font-size:34px;}
  .tagline{
    color:var(--brown-soft);
    font-size:14px;
    margin:2px 0 30px;
    letter-spacing:0.3px;
  }

  .auth-card{
    background:var(--paper);
    border-radius:var(--radius-card);
    box-shadow:0 18px 40px -18px var(--shadow), 0 2px 8px -2px var(--shadow);
    padding:28px 24px;
    width:100%;
    text-align:left;
  }
  .auth-tabs{
    display:flex;
    gap:6px;
    background:var(--cream);
    border-radius:999px;
    padding:4px;
    margin-bottom:22px;
  }
  .auth-tab{
    flex:1;
    border:none;
    background:transparent;
    padding:9px 0;
    border-radius:999px;
    font-size:14px;
    font-weight:600;
    color:var(--brown-soft);
    cursor:pointer;
    transition:background .2s, color .2s;
  }
  .auth-tab.active{
    background:linear-gradient(135deg, var(--gold-light), var(--gold-dark));
    color:#fff;
  }

  label{
    display:block;
    font-size:12.5px;
    font-weight:600;
    color:var(--brown-soft);
    margin:0 0 6px;
  }
  .field{margin-bottom:16px;}
  .field input, .field select{
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--line);
    border-radius:var(--radius-input);
    font-size:15px;
    color:var(--brown);
    background:#FFFEFC;
    outline:none;
    transition:border-color .15s;
  }
  .field input:focus, .field select:focus{border-color:var(--gold-dark);}

  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    border:none;
    border-radius:var(--radius-input);
    padding:13px 18px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease, opacity .12s ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{
    width:100%;
    background:linear-gradient(135deg, var(--gold-light), var(--gold-dark));
    color:#fff;
    box-shadow:0 10px 22px -10px rgba(184,118,62,0.55);
  }
  .btn-primary:disabled{opacity:0.55;cursor:default;}
  .btn-ghost{
    background:transparent;
    color:var(--brown-soft);
    padding:8px 10px;
  }

  .auth-msg{
    font-size:13px;
    margin-top:14px;
    padding:10px 12px;
    border-radius:10px;
    display:none;
  }
  .auth-msg.error{display:block;background:#FBEAE4;color:var(--danger);}
  .auth-msg.info{display:block;background:#F0F6EC;color:var(--ok);}

  .auth-foot{
    text-align:center;
    margin-top:18px;
    font-size:13px;
    color:var(--brown-soft);
  }
  .auth-foot button{
    background:none;border:none;color:var(--gold-dark);
    font-weight:600;cursor:pointer;font-size:13px;padding:0;
  }

  /* ---------- app screen ---------- */
  #app-screen{display:none;flex:1;flex-direction:column;}
  .app-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:22px;
  }
  .app-header .greet{
    font-size:12.5px;
    color:var(--brown-soft);
    margin-top:1px;
  }
  .header-actions{display:flex;align-items:center;gap:4px;}
  .icon-btn{
    background:var(--paper);
    border:1.5px solid var(--line);
    width:38px;height:38px;
    border-radius:11px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;color:var(--brown-soft);
  }
  .icon-btn:hover{border-color:var(--gold-mid);color:var(--gold-dark);}
  .icon-btn.danger-btn:hover{border-color:var(--danger);color:var(--danger);}
  .icon-btn.star-btn.active{
    background:linear-gradient(135deg, var(--gold-light), var(--gold-dark));
    border-color:transparent;
    color:#fff;
  }
  .icon-btn.star-btn.active svg{ fill:currentColor; }
  .icon-btn.pin-btn.active{
    background:var(--brown);
    border-color:transparent;
    color:var(--cream);
  }
  .icon-btn.pin-btn.active svg{ fill:currentColor; }

  /* new timer composer */
  .composer{
    background:var(--paper);
    border-radius:var(--radius-card);
    box-shadow:0 14px 30px -18px var(--shadow);
    padding:18px 18px 16px;
    margin-bottom:24px;
  }
  .composer .field{margin-bottom:12px;}
  .duration-row{
    display:flex;
    gap:10px;
    margin-bottom:14px;
  }
  .duration-row .field{flex:1;margin-bottom:0;}
  .duration-row input{text-align:center;}

  /* rentetan (timer chain) */
  .rentetan-section{ margin-bottom:14px; }
  .rentetan-list{ display:flex; flex-direction:column; }
  .rentetan-item{
    display:flex;
    gap:8px;
    position:relative;
    padding-left:18px;
  }
  .rentetan-item::before{
    content:'';
    position:absolute;
    left:5px;
    top:0;
    bottom:-2px;
    width:1.5px;
    background:var(--line);
  }
  .rentetan-item:last-child::before{ bottom:50%; }
  .rentetan-item::after{
    content:'';
    position:absolute;
    left:2px;
    top:16px;
    width:7px;height:7px;
    border-radius:50%;
    background:var(--gold-mid);
  }
  .rentetan-item-body{
    flex:1;
    min-width:0;
    background:#FFFEFC;
    border:1.5px solid var(--line);
    border-radius:14px;
    padding:12px;
    margin-bottom:10px;
  }
  .rentetan-item-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
  }
  .rentetan-item-num{
    font-size:11.5px;
    font-weight:700;
    color:var(--gold-dark);
    text-transform:uppercase;
    letter-spacing:.02em;
  }
  .rentetan-remove-btn{
    background:none;
    border:none;
    color:var(--brown-faint);
    cursor:pointer;
    padding:4px;
    display:flex;
    border-radius:6px;
  }
  .rentetan-remove-btn:hover{ color:var(--danger); background:#FBEAE4; }
  .rentetan-item-body .field{ margin-bottom:10px; }
  .rentetan-item-body .field:last-child{ margin-bottom:0; }
  .rentetan-item-body input{ text-align:left; }
  .rentetan-add-btn{
    width:100%;
    border:1.5px dashed var(--gold-mid);
    background:transparent;
    color:var(--gold-dark);
    font-size:12.5px;
    font-weight:600;
    padding:10px;
    border-radius:14px;
    cursor:pointer;
    margin-left:18px;
    width:calc(100% - 18px);
  }
  .rentetan-add-btn:hover{ background:#FBEEDB; }
  .rentetan-total{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#FBEEDB;
    border-radius:14px;
    padding:12px 14px;
    margin:14px 0;
    font-size:13px;
    font-weight:600;
    color:var(--brown-soft);
  }
  .rentetan-total strong{
    font-family:var(--serif);
    font-size:16px;
    color:var(--gold-dark);
  }

  /* timer list */
  #timer-list{
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .empty-state{
    text-align:center;
    padding:20px 10px;
    color:var(--brown-faint);
  }
  .empty-state img{width:56px;opacity:0.55;margin-bottom:14px;}
  .empty-state p{font-size:14px;margin:0;line-height:1.6;}

  .timer-card{
    background:var(--paper);
    border-radius:var(--radius-card);
    box-shadow:0 12px 26px -18px var(--shadow);
    padding:18px 18px 16px;
    position:relative;
    overflow:hidden;
  }
  .timer-card.finished{
    box-shadow:0 12px 26px -16px rgba(181,83,60,0.35);
  }
  .timer-card .bar-bg{
    position:absolute;left:0;top:0;height:3px;width:100%;
    background:var(--line);
  }
  .timer-card .bar-fill{
    position:absolute;left:0;top:0;height:3px;
    background:linear-gradient(90deg, var(--gold-light), var(--gold-dark));
    transition:width 1s linear;
  }
  .timer-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:10px;
    margin-top:4px;
  }
  .timer-name{
    font-weight:600;
    font-size:15px;
    color:var(--brown);
    word-break:break-word;
    padding-right:8px;
  }
  .timer-name .status{
    display:block;
    font-size:11.5px;
    font-weight:500;
    color:var(--brown-faint);
    margin-top:2px;
  }
  .card-actions{display:flex;align-items:center;gap:2px;flex-shrink:0;}
  .delete-btn{
    background:none;border:none;color:var(--brown-faint);
    cursor:pointer;padding:4px;flex-shrink:0;
  }
  .delete-btn:hover{color:var(--danger);}
  .edit-btn{
    background:none;border:none;color:var(--brown-faint);
    cursor:pointer;padding:4px;flex-shrink:0;
  }
  .edit-btn:hover{color:var(--gold-dark);}

  .timer-mid{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
  }
  .timer-digits{
    font-family:var(--serif);
    font-weight:600;
    font-size:38px;
    color:var(--brown);
    letter-spacing:0.5px;
    font-variant-numeric:tabular-nums;
  }
  .timer-card.finished .timer-digits{color:var(--danger);}

  .timer-controls{display:flex;gap:8px;}
  .ctrl-btn{
    width:44px;height:44px;
    border-radius:13px;
    border:none;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    color:#fff;
  }
  .ctrl-btn.play{background:linear-gradient(135deg, var(--gold-light), var(--gold-dark));}
  .ctrl-btn.pause{background:var(--brown-soft);}
  .ctrl-btn.reset{background:var(--paper);color:var(--brown-soft);border:1.5px solid var(--line);}
  .ctrl-btn:active{transform:scale(0.94);}

  /* compact variant used for chain/sequence lists so many steps fit without excess scrolling */
  .timer-card-compact{padding:12px 14px 11px;}
  .timer-card-compact .timer-top{margin-bottom:0;margin-top:0;}
  .timer-card-compact .timer-top.compact{align-items:center;gap:10px;flex-wrap:nowrap;}
  .timer-card-compact .timer-name{font-size:14px;flex:1;min-width:0;padding-right:0;}
  .timer-card-compact .timer-digits-wrap{flex-shrink:0;}
  .timer-card-compact .timer-digits{font-size:15px;font-family:var(--sans);font-weight:500;letter-spacing:0;}
  .timer-card-compact .bar-bg{display:none;}
  .timer-card-compact .bar-fill{display:none;}
  .timer-card-compact + .timer-card-compact{border-top:1px solid var(--line);}
  .timer-card-compact .step-number{width:18px;height:18px;font-size:11px;}
  .timer-card-compact .card-actions{flex-shrink:0;}
  .timer-card-compact .timer-controls.compact{justify-content:flex-end;margin-top:8px;}
  .timer-card-compact .ctrl-btn{width:34px;height:34px;border-radius:10px;}
  .timer-card-compact .ctrl-btn svg{width:14px;height:14px;}

  footer.hint{
    text-align:center;
    color:var(--brown-faint);
    font-size:12px;
    margin-top:30px;
  }

  /* ---------- tabs ---------- */
  .tab-screen{flex:1;}
  .section-title{
    font-family:var(--serif);
    font-size:16px;
    font-weight:600;
    color:var(--brown);
    margin:4px 0 12px;
  }

  /* dashboard stats */
  .stats-row{
    display:flex;
    gap:10px;
    margin-bottom:22px;
  }
  .stat-card{
    flex:1;
    background:var(--paper);
    border-radius:16px;
    box-shadow:0 12px 26px -18px var(--shadow);
    padding:14px 8px;
    text-align:center;
  }
  .stat-num{
    font-family:var(--serif);
    font-size:24px;
    font-weight:700;
    color:var(--gold-dark);
  }
  .stat-label{
    font-size:11px;
    color:var(--brown-soft);
    margin-top:2px;
  }

  /* folder chips */
  .folder-chips{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:8px;
    margin-bottom:18px;
  }
  .folder-chips-top{
    display:flex;
    align-items:center;
    gap:8px;
    width:100%;
    padding-bottom:14px;
    margin-bottom:6px;
    border-bottom:1px solid var(--line);
  }
  .folder-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:6px;
    width:100%;
    padding:10px 4px;
    border-bottom:1px solid var(--line);
  }
  .folder-row:last-child{
    border-bottom:none;
  }
  .folder-row.active{
    border-radius:999px;
    padding:8px 8px 8px 14px;
    border-bottom:none;
    background:linear-gradient(135deg, var(--gold-light), var(--gold-dark));
  }
  .folder-row.active .folder-chip-label{ color:#fff; }
  .folder-row.active .folder-row-action{ color:rgba(255,255,255,0.85); }
  .folder-row.active .folder-row-action:hover{ color:#fff; }
  .folder-chip-label{
    border:none;
    background:transparent;
    color:var(--brown-soft);
    font-size:12.5px;
    font-weight:600;
    text-align:left;
    cursor:pointer;
    flex:1;
    min-width:0;
    padding:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .folder-row-main{
    display:flex;
    align-items:center;
    gap:8px;
    flex:1;
    min-width:0;
  }
  .folder-row-total{
    font-size:12px;
    font-weight:500;
    color:var(--brown-faint);
    flex-shrink:0;
    font-variant-numeric:tabular-nums;
  }
  .folder-row.active .folder-row-total{ color:rgba(255,255,255,0.85); }
  .folder-row-actions{
    display:flex;
    align-items:center;
    gap:2px;
    flex-shrink:0;
  }
  .folder-row-action{
    background:none;
    border:none;
    color:var(--brown-faint);
    cursor:pointer;
    padding:5px;
    flex-shrink:0;
    display:flex;
    border-radius:6px;
  }
  .folder-row-action:hover{ color:var(--gold-dark); background:#FBEEDB; }
  .folder-row-action.danger:hover{ color:var(--danger); background:#FBEAE4; }
  .folder-row-action:disabled{ color:var(--brown-faint); opacity:0.35; cursor:default; background:none; }
  .folder-row-action.pin-toggle.active{ color:var(--brown); background:#EFE2CD; }
  .folder-row-action.star-toggle.active{ color:var(--gold-dark); background:#FBEEDB; }
  .folder-row.active .folder-row-action.pin-toggle.active,
  .folder-row.active .folder-row-action.star-toggle.active{ color:#fff; background:rgba(255,255,255,0.28); }
  .folder-row-action-start{
    display:flex;
    align-items:center;
    gap:6px;
    border:none;
    border-radius:999px;
    padding:7px 14px;
    font-size:11.5px;
    font-weight:700;
    letter-spacing:0.2px;
    cursor:pointer;
    background:linear-gradient(135deg, var(--gold-light), var(--gold-dark));
    color:#fff;
    box-shadow:0 8px 16px -8px rgba(184,118,62,0.6);
    flex-shrink:0;
    margin-left:4px;
    transition:transform .12s ease, opacity .12s ease, box-shadow .12s ease;
  }
  .folder-row-action-start:hover{ transform:scale(1.04); }
  .folder-row-action-start:active{ transform:scale(0.97); }
  .folder-row-action-start:disabled{
    background:var(--line);
    color:var(--brown-faint);
    box-shadow:none;
    cursor:default;
    transform:none;
  }
  .folder-row.active .folder-row-action-start:disabled{ background:rgba(255,255,255,0.28); color:rgba(255,255,255,0.85); }
  .folder-chip{
    border:none;
    background:transparent;
    color:var(--brown-soft);
    font-size:12.5px;
    font-weight:600;
    padding:8px 14px;
    border-radius:999px;
    cursor:pointer;
  }
  .folder-chip.active{
    background:linear-gradient(135deg, var(--gold-light), var(--gold-dark));
    color:#fff;
    border-color:transparent;
  }
  .folder-chip-add{
    width:36px;height:36px;
    flex-shrink:0;
    border-radius:50%;
    border:1.5px dashed var(--gold-mid);
    background:transparent;
    color:var(--gold-dark);
    font-size:18px;
    font-weight:700;
    line-height:1;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .folder-chip-add:hover{background:#FBEEDB;}
  .folder-search-btn{
    width:36px;height:36px;
    flex-shrink:0;
    border-radius:50%;
    border:1.5px solid var(--line);
    background:var(--paper);
    color:var(--brown-soft);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    transition:background .15s, color .15s, border-color .15s;
  }
  .folder-search-btn:hover{ background:#FBEEDB; color:var(--gold-dark); }
  .folder-search-btn.active{
    background:linear-gradient(135deg, var(--gold-light), var(--gold-dark));
    color:#fff;
    border-color:transparent;
  }
  .folder-search-wrap{
    display:flex;
    align-items:center;
    flex:1;
    min-width:0;
    gap:4px;
    background:var(--paper);
    border:1.5px solid var(--line);
    border-radius:999px;
    padding:0 6px 0 14px;
  }
  .folder-search-wrap input{
    flex:1;
    min-width:0;
    border:none;
    outline:none;
    background:transparent;
    font-size:12.5px;
    font-weight:600;
    color:var(--brown);
    padding:8px 0;
  }
  .folder-search-wrap input::placeholder{ color:var(--brown-faint); font-weight:500; }
  .folder-search-clear{
    border:none;
    background:none;
    color:var(--brown-faint);
    cursor:pointer;
    padding:6px;
    display:flex;
    flex-shrink:0;
    border-radius:50%;
  }
  .folder-search-clear:hover{ color:var(--danger); background:#FBEAE4; }
  .folder-search-empty{
    padding:16px 4px;
    text-align:center;
    font-size:12.5px;
    color:var(--brown-faint);
  }
  .folder-priority-badge{
    display:flex;
    align-items:center;
    flex-shrink:0;
    color:var(--gold-dark);
  }
  .folder-pin-badge{
    display:flex;

function updateReleaseAge(){
  if(!settingsReleaseAge) return;
  const release = new Date(2026, 8, 17); // 17 September 2026
  const now = new Date();
  let years = now.getFullYear() - release.getFullYear();
  let months = now.getMonth() - release.getMonth();
  if(now.getDate() < release.getDate()) months -= 1;
  if(months < 0){ years -= 1; months += 12; }
  let label;
  if(years <= 0 && months <= 0){
    label = 'Baru rilis';
  }else if(years <= 0){
    label = `${months} bulan`;
  }else if(months === 0){
    label = `${years} tahun`;
  }else{
    label = `${years} tahun ${months} bulan`;
  }
  settingsReleaseAge.textContent = label;
}

/* ---------------- simple beep (no external audio file) ---------------- */
function playChime(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const now = ctx.currentTime;
    [0, 0.28, 0.56].forEach((offset, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = i === 2 ? 880 : 660;
      gain.gain.setValueAtTime(0.0001, now + offset);
      gain.gain.exponentialRampToValueAtTime(0.25, now + offset + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + offset + 0.26);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now + offset);
      osc.stop(now + offset + 0.3);
    });
  }catch(e){ /* audio not available */ }
}

async function renameFolder(oldName, newName){
  const user = auth.currentUser;
  if(!user) return;
  const entry = Array.from(localFolders.entries()).find(([, d]) => d.name === oldName);
  if(entry){
    await updateDoc(doc(db, 'users', user.uid, 'folders', entry[0]), { name: newName });
  }else{
    await addDoc(collection(db, 'users', user.uid, 'folders'), { name: newName, createdAt: serverTimestamp() });
  }
  const timersInFolder = Array.from(localTimers.entries()).filter(([, d]) => (d.folder || 'Umum') === oldName);
  await Promise.all(timersInFolder.map(([id]) =>
    updateDoc(doc(db, 'users', user.uid, 'timers', id), { folder: newName })
  ));
}

async function handleDeleteFolder(folderName){
  const user = auth.currentUser;
  if(!user) return;
  const ok = confirm(`Hapus folder "${folderName}"? Timer di dalamnya akan dipindah ke folder Umum.`);
  if(!ok) return;
  try{
    const entry = Array.from(localFolders.entries()).find(([, d]) => d.name === folderName);
    if(entry){
      await deleteDoc(doc(db, 'users', user.uid, 'folders', entry[0]));
    }
    const timersInFolder = Array.from(localTimers.entries()).filter(([, d]) => (d.folder || 'Umum') === folderName);
    await Promise.all(timersInFolder.map(([id]) =>
      updateDoc(doc(db, 'users', user.uid, 'timers', id), { folder: 'Umum' })
    ));
    if(currentFolder === folderName){
      currentFolder = 'Semua';
      folderListView = true;
    }
  }catch(err){
    console.error(err);
    alert('Gagal menghapus folder: ' + (err && err.message ? err.message : 'kesalahan tidak diketahui'));
  }
}

async function handleDuplicateFolder(folderName){
  const user = auth.currentUser;
  if(!user) return;
  let newName = folderName + ' (Salinan)';
  let suffix = 2;
  while(knownFolderNames.some(f => f.toLowerCase() === newName.toLowerCase())){
    newName = folderName + ' (Salinan ' + suffix + ')';
    suffix++;
  }
  try{
    await addDoc(collection(db, 'users', user.uid, 'folders'), { name: newName, createdAt: serverTimestamp() });
    const timersInFolder = Array.from(localTimers.entries()).filter(([, d]) => (d.folder || 'Umum') === folderName);
    await Promise.all(timersInFolder.map(([, d]) =>
      addDoc(collection(db, 'users', user.uid, 'timers'), {
        name: d.name,
        folder: newName,
        durationSeconds: d.durationSeconds,
        remainingSeconds: d.durationSeconds,
        status: 'idle',
        endAt: null,
        createdAt: serverTimestamp()
      })
    ));
    currentFolder = newName;
  }catch(err){
    console.error(err);
    alert('Gagal menduplikat folder: ' + (err && err.message ? err.message : 'kesalahan tidak diketahui'));
  }
}

function friendlyFirestoreError(err){
  const code = err && err.code;
  if(code === 'permission-denied'){
    return 'Ditolak oleh Firestore Rules. Pastikan Rules sudah diatur agar user boleh menulis ke koleksi timernya sendiri (lihat README).';
  }
  if(code === 'unavailable' || code === 'failed-precondition'){
    return 'Firestore Database sepertinya belum dibuat untuk project ini. Buat database di Firebase Console (Firestore Database → Create database).';
  }
  if(code === 'unauthenticated'){
    return 'Sesi login sudah tidak valid. Coba keluar lalu masuk lagi.';
  }
  return 'Gagal menambah timer: ' + (err && err.message ? err.message : 'kesalahan tidak diketahui') + '. Cek Console browser (F12) untuk detail.';
}

addTimerBtn.addEventListener('click', async () => {
  hideComposerMsg();
  const user = auth.currentUser;
  if(!user){
    showComposerMsg('Kamu belum masuk. Muat ulang halaman dan masuk lagi.', 'error');
    return;
  }
  const name = timerNameInput.value.trim() || 'Timer';
  const min = Math.max(0, parseInt(durMinInput.value, 10) || 0);
  const totalSec = min * 60;
  if(totalSec <= 0){
    showComposerMsg('Atur durasi menit lebih dari 0 dulu.', 'error');
    durMinInput.focus();
    return;
  }
  let folder;
  if(timerFolderSelect.value === '__new__'){
    folder = timerFolderNewInput.value.trim();
    if(!folder){
      showComposerMsg('Isi nama folder baru dulu, atau pilih folder yang sudah ada.', 'error');
      timerFolderNewInput.focus();
      return;
    }
  }else{
    folder = timerFolderSelect.value || 'Umum';
  }
  const rentetanSteps = Array.from(rentetanList.querySelectorAll('.rentetan-item')).map((item, i) => {
    const stepMin = Math.max(0, parseInt(item.querySelector('.rentetan-minutes-input').value, 10) || 0);
    const stepName = item.querySelector('.rentetan-name-input').value.trim() || `Rentetan ${i + 1}`;
    return { name: stepName, durationSeconds: stepMin * 60 };
  }).filter(step => step.durationSeconds > 0);
  const isChain = rentetanSteps.length > 0;
  const isFolderInsert = !editingId && stepOrderField.style.display !== 'none';
  const startsIdle = isChain || isFolderInsert; // rentetan/antrean folder: semua antre dulu, dimulai manual lewat "Mulai urutan"
  addTimerBtn.disabled = true;
  try{
    let insertOrder = null;
    if(isFolderInsert){
      const totalNew = 1 + rentetanSteps.length;
      const desired = parseInt(stepOrderInput.value, 10);
      insertOrder = await shiftFolderQueueForInsert(folder, desired, totalNew);
    }
    if(editingId){
      await updateDoc(doc(db, 'users', user.uid, 'timers', editingId), {
        name,
        folder,
        durationSeconds: totalSec,
        remainingSeconds: totalSec,
        status: 'idle',
        endAt: null
      });
    }else{
      await addDoc(collection(db, 'users', user.uid, 'timers'), {
        name,
        folder,
        durationSeconds: totalSec,
        remainingSeconds: totalSec,
        status: startsIdle ? 'idle' : 'running',
        endAt: startsIdle ? null : Date.now() + totalSec * 1000,
        createdAt: serverTimestamp(),
        ...(insertOrder !== null ? { order: insertOrder } : {})
      });
    }
    let stepOrderCounter = insertOrder !== null ? insertOrder + 1 : null;
    for(const step of rentetanSteps){
      await addDoc(collection(db, 'users', user.uid, 'timers'), {
        name: step.name,
        folder,
        durationSeconds: step.durationSeconds,
        remainingSeconds: step.durationSeconds,
        status: 'idle', // menunggu giliran, otomatis lanjut lewat maybeStartNextInFolder
        endAt: null,
        createdAt: serverTimestamp(),
        ...(stepOrderCounter !== null ? { order: stepOrderCounter } : {})
      });
      if(stepOrderCounter !== null) stepOrderCounter++;
    }
    timerNameInput.value = '';
    timerFolderNewInput.value = '';
    resetRentetanList();
    currentFolder = folder;
    closeAddModal();
    if(isChain){
      switchToTab('folders');
      openFolderDetail(folder);
    }
  }catch(err){
    console.error(err);
    showComposerMsg(friendlyFirestoreError(err), 'error');
  }finally{
    addTimerBtn.disabled = false;
  }
});

/* ---------------- firestore sync ---------------- */
function subscribeTimers(uid){
  const q = query(collection(db, 'users', uid, 'timers'), orderBy('createdAt', 'desc'));
  unsubscribeTimers = onSnapshot(q, (snap) => {
    localTimers.clear();
    snap.forEach(docSnap => {
      localTimers.set(docSnap.id, docSnap.data());
    });
    renderAll();
  }, (err) => {
    console.error(err);
    showComposerMsg(friendlyFirestoreError(err), 'error');
  });
}

function subscribeFolders(uid){
  const q = collection(db, 'users', uid, 'folders');
  unsubscribeFolders = onSnapshot(q, (snap) => {
    localFolders.clear();
    snap.forEach(docSnap => {
      localFolders.set(docSnap.id, docSnap.data());
    });
    renderAll();
  }, (err) => {
    console.error(err);
  });
}

function fmt(totalSeconds){
  const s = Math.max(0, Math.round(totalSeconds));
  const m = Math.floor(s / 60);
  const r = s % 60;
  return String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0');
}

function currentRemaining(data){
  if(data.status === 'running' && data.endAt){
    const endMs = data.endAt.toMillis ? data.endAt.toMillis() : data.endAt;
    return Math.max(0, (endMs - Date.now()) / 1000);
  }
  return data.remainingSeconds;
}

function renderList(container, entries, emptyMsg, stepMap){
  if(entries.length === 0){
    container.innerHTML = `
      <div class="empty-state">
        <img src="icons/icon-192.png" alt="">
        ${emptyMsg ? `<p>${emptyMsg}</p>` : ''}
      </div>`;
    return;
  }
  const frag = document.createDocumentFragment();
  entries.forEach(([id, data]) => frag.appendChild(buildCard(id, data, stepMap && stepMap.get(id))));
  container.innerHTML = '';
  container.appendChild(frag);
}

function timestampMs(data){
  return data.createdAt && data.createdAt.toMillis ? data.createdAt.toMillis() : 0;
}

function getFolderQueue(folderName){
  return Array.from(localTimers.entries())
    .filter(([, d]) => (d.folder || 'Umum') === folderName)
    .sort((a, b) => {
      const oa = (a[1].order === undefined || a[1].order === null) ? Infinity : a[1].order;
      const ob = (b[1].order === undefined || b[1].order === null) ? Infinity : b[1].order;
      if(oa !== ob) return oa - ob;
      return timestampMs(a[1]) - timestampMs(b[1]);
    });
}

// Geser urutan langkah yang sudah ada di folder supaya timer baru bisa disisipkan
// di posisi manapun (bukan cuma di akhir). Menomori ulang seluruh antrean folder
// dengan field `order` eksplisit, lalu mengembalikan posisi (1-based) untuk item baru.
async function shiftFolderQueueForInsert(folder, desiredPosition, countNew){
  const user = auth.currentUser;
  const queue = getFolderQueue(folder);
  const maxPos = queue.length + 1;
  const clamped = Math.min(Math.max(1, desiredPosition || maxPos), maxPos);
  const updates = queue.map(([id], i) => {
    const origPos = i + 1;
    const newPos = origPos >= clamped ? origPos + countNew : origPos;
    return updateDoc(doc(db, 'users', user.uid, 'timers', id), { order: newPos });
  });
  await Promise.all(updates);
  return clamped;
}

function renderAll(){
  const all = Array.from(localTimers.entries());
  const active = all.filter(([, d]) => d.status !== 'finished');
  const running = all.filter(([, d]) => d.status === 'running');
  const finished = all.filter(([, d]) => d.status === 'finished');

  /* dashboard stats */
  statTotal.textContent = all.length;
  statRunning.textContent = running.length;
  statFinished.textContent = finished.length;

  /* folders: distinct folder names from active timers + explicitly-created empty folders */
  const explicitFolderNames = Array.from(localFolders.values()).map(f => f.name);
  const folderNames = Array.from(new Set([
    ...active.map(([, d]) => d.folder || 'Umum'),
    ...explicitFolderNames
  ])).sort();
  if(!folderNames.includes(currentFolder) && currentFolder !== 'Semua'){
    currentFolder = 'Semua';
    folderListView = true;
  }
  knownFolderNames = Array.from(new Set([
    ...all.map(([, d]) => d.folder || 'Umum'),
    ...explicitFolderNames
  ])).sort();
  populateFolderSelect();

  if(currentTab === 'dashboard'){
    renderList(dashboardRunningList, running, '');
  }
  if(currentTab === 'folders'){
    folderListViewEl.style.display = folderListView ? '' : 'none';
    folderDetailViewEl.style.display = folderListView ? 'none' : '';
    const searchedFolderNames = folderSearchQuery.trim()
      ? folderNames.filter(f => f.toLowerCase().includes(folderSearchQuery.trim().toLowerCase()))
      : folderNames;

    folderChipsRow.innerHTML =
      `<div class="folder-chips-top">` +
        `<button class="folder-search-btn${folderSearchOpen ? ' active' : ''}" id="folder-search-btn" type="button" title="Cari folder">${iconSearchSmall()}</button>` +
        (folderSearchOpen
          ? `<div class="folder-search-wrap">
               <input type="text" id="folder-search-input" placeholder="Cari folder..." value="${escapeHtml(folderSearchQuery)}">
               <button class="folder-search-clear" id="folder-search-clear" type="button" title="Tutup">${iconCloseSmall()}</button>
             </div>`
          : `<button class="folder-chip${currentFolder === 'Semua' ? ' active' : ''}" data-folder="Semua" type="button">Semua</button>`
        ) +
        `<button class="folder-chip-add" id="add-folder-chip" type="button" title="Tambah folder">+</button>` +
      `</div>` +
      (searchedFolderNames.length === 0
        ? `<div class="folder-search-empty">Tidak ada folder yang cocok.</div>`
        : (() => {
            const buildRow = (f) => {
              const queue = getFolderQueue(f);
              const anyRunning = queue.some(([, d]) => d.status === 'running');
              const hasIdle = queue.some(([, d]) => d.status === 'idle');
              const canStart = queue.length > 0 && hasIdle && !anyRunning;
              const totalSeconds = queue.reduce((sum, [, d]) => sum + (d.durationSeconds || 0), 0);
              const priority = isFolderPriority(f);
              const pinned = isFolderPinned(f);
              return `
              <div class="folder-row${f === currentFolder ? ' active' : ''}" data-folder="${escapeHtml(f)}">
                <div class="folder-row-main">
                  <button class="folder-chip-label" data-folder="${escapeHtml(f)}" type="button">${escapeHtml(f)}</button>
                  <span class="folder-row-total">${fmt(totalSeconds)}</span>
                </div>
                <div class="folder-row-actions">
                  <button class="folder-row-action pin-toggle${pinned ? ' active' : ''}" title="${pinned ? 'Lepas sematan' : 'Sematkan folder'}" data-folder-action="toggle-pin" data-folder="${escapeHtml(f)}" type="button">${iconPinSmall()}</button>
                  <button class="folder-row-action star-toggle${priority ? ' active' : ''}" title="${priority ? 'Hapus dari prioritas' : 'Tandai prioritas'}" data-folder-action="toggle-priority" data-folder="${escapeHtml(f)}" type="button">${iconStarSmall()}</button>
                  <button class="folder-row-action" title="Duplikat" data-folder-action="duplicate" data-folder="${escapeHtml(f)}" type="button">${iconDuplicateSmall()}</button>
                  <button class="folder-row-action" title="Edit" data-folder-action="edit" data-folder="${escapeHtml(f)}" type="button">${iconEditSmall()}</button>
                  <button class="folder-row-action-start" title="${anyRunning ? 'Sedang berjalan' : 'Mulai urutan'}" data-folder-action="start" data-folder="${escapeHtml(f)}" type="button" ${canStart ? '' : 'disabled'}>${iconPlaySmall()}<span>${anyRunning ? 'Berjalan' : 'Mulai'}</span></button>
                </div>
              </div>
            `;
            };
            const pinnedFolders = searchedFolderNames.filter(f => isFolderPinned(f));
            const priorityFolders = searchedFolderNames.filter(f => !isFolderPinned(f) && isFolderPriority(f));
            const otherFolders = searchedFolderNames.filter(f => !isFolderPinned(f) && !isFolderPriority(f));
            return (
              (pinnedFolders.length ? `<div class="folder-section-label">Disematkan</div>` + pinnedFolders.map(buildRow).join('') : '') +
              (priorityFolders.length ? `<div class="folder-section-label">Prioritas</div>` + priorityFolders.map(buildRow).join('') : '') +
              (otherFolders.length ? ((pinnedFolders.length || priorityFolders.length) ? `<div class="folder-section-label">Semua folder</div>` : '') + otherFolders.map(buildRow).join('') : '')
            );
          })());
    folderChipsRow.querySelectorAll('.folder-chip').forEach(chip => {
      chip.addEventListener('click', () => openFolderDetail(chip.dataset.folder));
    });
    folderChipsRow.querySelectorAll('.folder-chip-label').forEach(chip => {
      chip.addEventListener('click', () => openFolderDetail(chip.dataset.folder));
    });
    folderChipsRow.querySelectorAll('[data-folder-action]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const action = btn.dataset.folderAction;
        const folderName = btn.dataset.folder;
        if(action === 'edit') openEditFolderModal(folderName);
        else if(action === 'duplicate') handleDuplicateFolder(folderName);
        else if(action === 'start') runFolderSequence(folderName);
        else if(action === 'toggle-pin') toggleFolderPinned(folderName);
        else if(action === 'toggle-priority') toggleFolderPriority(folderName);
      });
    });
    document.getElementById('add-folder-chip').addEventListener('click', openNewFolderModal);

    const folderSearchBtn = document.getElementById('folder-search-btn');
    if(folderSearchBtn){
      folderSearchBtn.addEventListener('click', () => {
        folderSearchOpen = !folderSearchOpen;
        if(!folderSearchOpen) folderSearchQuery = '';
        renderAll();
        if(folderSearchOpen){
          const input = document.getElementById('folder-search-input');
          if(input) input.focus();
        }
      });
    }
    const folderSearchInput = document.getElementById('folder-search-input');
    if(folderSearchInput){
      folderSearchInput.addEventListener('input', (e) => {
        folderSearchQuery = e.target.value;
        renderAll();
        const refocused = document.getElementById('folder-search-input');
        if(refocused){
          refocused.focus();
          const pos = refocused.value.length;
          refocused.setSelectionRange(pos, pos);
        }
      });
    }
    const folderSearchClear = document.getElementById('folder-search-clear');
    if(folderSearchClear){
      folderSearchClear.addEventListener('click', () => {
        folderSearchOpen = false;
        folderSearchQuery = '';
        renderAll();
      });
    }

    if(!folderListView){
      folderDetailTitle.textContent = currentFolder;
      const isSemua = currentFolder === 'Semua';
      folderDeleteBtn.style.display = isSemua ? 'none' : '';
      const visible = currentFolder === 'Semua'
        ? active
        : active.filter(([, d]) => (d.folder || 'Umum') === currentFolder);

      if(currentFolder === 'Semua'){
        renderList(folderTimerList, visible, '');
      }else{
        const queue = getFolderQueue(currentFolder);
        const stepMap = new Map(queue.map(([id], i) => [id, i + 1]));
        const orderedVisible = queue.filter(([, d]) => d.status !== 'finished');
        renderList(folderTimerList, orderedVisible, '', stepMap);
      }
    }
  }
  if(currentTab === 'history'){
    renderList(historyList, finished, '');
  }
}

function buildCard(id, data, stepLabel){
  const compact = !!stepLabel;
  const remaining = currentRemaining(data);
  // Kartu langkah di antrean folder (compact) menampilkan durasi bulat seperti
  // semula diatur untuk status idle/dijeda — hanya langkah yang benar-benar
  // sedang berjalan yang menunjukkan hitungan mundur langsung.
  const displaySeconds = (compact && (data.status === 'idle' || data.status === 'paused'))
    ? data.durationSeconds
    : remaining;
  const pct = data.durationSeconds > 0 ? Math.min(100, Math.max(0, (displaySeconds / data.durationSeconds) * 100)) : 0;
  const finished = data.status === 'finished';

  const card = document.createElement('div');
  card.className = 'timer-card' + (compact ? ' timer-card-compact' : '') + (finished ? ' finished' : '');
  card.dataset.id = id;

  const statusLabel = compact
    ? {
        idle: '',
        running: '',
        paused: '',
        finished: 'Selesai'
      }[data.status] || ''
    : {
        idle: 'Siap',
        running: 'Berjalan',
        paused: 'Dijeda',
        finished: 'Selesai'
      }[data.status] || '';

  const digitsWrapHtml = `
    <div class="timer-digits" data-role="digits">${fmt(displaySeconds)}</div>
  `;
  const controlsHtml = `
    ${finished
      ? `<button class="ctrl-btn reset" data-action="reset" title="Ulangi">${iconReset()}</button>`
      : data.status === 'running'
        ? `<button class="ctrl-btn pause" data-action="pause" title="Jeda">${iconPause()}</button>`
        : compact ? '' : `<button class="ctrl-btn play" data-action="play" title="Mulai">${iconPlay()}</button>`
    }
    ${compact ? '' : `<button class="ctrl-btn reset" data-action="reset" title="Atur ulang">${iconRotate()}</button>`}
  `;
  const editDeleteHtml = `
    <button class="edit-btn" title="Edit" data-action="edit">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></svg>
    </button>
    <button class="delete-btn" title="Hapus" data-action="delete">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
    </button>
  `;

  card.innerHTML = compact ? `
    <div class="bar-bg"><div class="bar-fill" style="width:${pct}%"></div></div>
    <div class="timer-top compact">
      ${stepLabel ? `<span class="step-number">${escapeHtml(stepLabel)}</span>` : ''}
      <div class="timer-name">${escapeHtml(data.name)}${statusLabel ? `<span class="status">${statusLabel}</span>` : ''}</div>
      <div class="timer-digits-wrap">${digitsWrapHtml}</div>
      <div class="card-actions">${editDeleteHtml}</div>
    </div>
    ${controlsHtml.trim() ? `<div class="timer-controls compact">${controlsHtml}</div>` : ''}
  ` : `
    <div class="bar-bg"><div class="bar-fill" style="width:${pct}%"></div></div>
    <div class="timer-top">
      <div class="timer-name">${escapeHtml(data.name)}<span class="status"><span class="folder-badge">${escapeHtml(data.folder || 'Umum')}</span>${statusLabel}</span></div>
      <div class="card-actions">${editDeleteHtml}</div>
    </div>
    <div class="timer-mid">
      <div class="timer-digits-wrap">${digitsWrapHtml}</div>
      <div class="timer-controls">${controlsHtml}</div>
    </div>
  `;

  card.querySelector('[data-action="delete"]').addEventListener('click', () => handleDelete(id));
  card.querySelector('[data-action="edit"]').addEventListener('click', () => openEditModal(id, data));
  const playBtn = card.querySelector('[data-action="play"]');
  if(playBtn) playBtn.addEventListener('click', () => handlePlay(id, data));
  const pauseBtn = card.querySelector('[data-action="pause"]');
  if(pauseBtn) pauseBtn.addEventListener('click', () => handlePause(id, data));
  card.querySelectorAll('[data-action="reset"]').forEach(btn => btn.addEventListener('click', () => handleReset(id, data)));

  return card;
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

/* ---------------- timer actions ---------------- */
async function handlePlay(id, data){
  const user = auth.currentUser;
  if(!user) return;
  const remaining = currentRemaining(data) > 0 ? currentRemaining(data) : data.durationSeconds;
  const endAt = Date.now() + remaining * 1000;
  await updateDoc(doc(db, 'users', user.uid, 'timers', id), {
    status: 'running',
    endAt,
    remainingSeconds: remaining
  });
}

/* start the next never-started timer in the same folder, in creation order */
async function maybeStartNextInFolder(folderName, finishedData){
  const queue = getFolderQueue(folderName);
  const finishedMs = timestampMs(finishedData);
  const next = queue.find(([, d]) => timestampMs(d) > finishedMs && d.status === 'idle');
  if(next) await handlePlay(next[0], next[1]);
}

function runFolderSequence(folderName){
  const queue = getFolderQueue(folderName);
  const anyRunning = queue.some(([, d]) => d.status === 'running');
  if(anyRunning) return;
  const first = queue.find(([, d]) => d.status === 'idle');
  if(first) handlePlay(first[0], first[1]);
}

async function handlePause(id, data){
  const user = auth.currentUser;
  if(!user) return;
  const remaining = currentRemaining(data);
  await updateDoc(doc(db, 'users', user.uid, 'timers', id), {
    status: 'paused',
    endAt: null,
    remainingSeconds: remaining
  });
}

async function handleReset(id, data){
  const user = auth.currentUser;
  if(!user) return;
  await updateDoc(doc(db, 'users', user.uid, 'timers', id), {
    status: 'idle',
    endAt: null,
    remainingSeconds: data.durationSeconds
  });
}

async function handleDelete(id){
  const user = auth.currentUser;
  if(!user) return;
  await deleteDoc(doc(db, 'users', user.uid, 'timers', id));
}

/* ---------------- ticking (local display + finish detection) ---------------- */
function startTicker(){
  stopTicker();
  tickHandle = setInterval(tick, 250);
}
function stopTicker(){
  if(tickHandle){ clearInterval(tickHandle); tickHandle = null; }
}

async function tick(){
  const user = auth.currentUser;
  if(!user) return;
  for(const [id, data] of localTimers.entries()){
    if(data.status !== 'running') continue;
    const remaining = currentRemaining(data);
    document.querySelectorAll(`.timer-card[data-id="${id}"] [data-role="digits"]`).forEach(el => {
      el.textContent = fmt(remaining);
    });
    if(data.durationSeconds > 0){
      const pct = Math.min(100, Math.max(0, (remaining / data.durationSeconds) * 100)) + '%';
      document.querySelectorAll(`.timer-card[data-id="${id}"] .bar-fill`).forEach(el => {
        el.style.width = pct;
      });
    }
    if(remaining <= 0){
      data.status = 'finished';
      playChime();
      notify('Essentime', `"${data.name}" selesai.`);
      try{
        await updateDoc(doc(db, 'users', user.uid, 'timers', id), {
          status: 'finished',
          endAt: null,
          remainingSeconds: 0
        });
        await maybeStartNextInFolder(data.folder || 'Umum', data);
      }catch(e){ /* will resync on next snapshot */ }
    }
  }
}

/* ---------------- service worker ---------------- */
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
